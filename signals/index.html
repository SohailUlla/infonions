<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signals - Real-Time Intelligence | Infonions</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="bg-network"></div>

<header>
    <div class="header-content">
        <div class="logo-section">
            <div class="logo-icon">🌊</div>
            <div>
                <div class="logo-text">INFONIONS</div>
                <div class="tagline">Discover What Unfolds</div>
            </div>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/signals/" class="active">Signals</a>
            <a href="/about.html">About</a>
        </nav>
    </div>
</header>

<div class="dashboard">

    <!-- HEADER -->
    <div class="page-header">

        <h1 class="page-title">📊 Real-Time Intelligence</h1>
        <p class="page-subtitle">
            Real user reactions from Pulse & Deep Dive
        </p>

        <!-- LIVE SIGNALS -->
        <div class="panel full-width-panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    ⚡ Live Signals
                    <span class="panel-badge">Live</span>
                </h2>
            </div>

            <!-- ✅ CONNECTED -->
            <div id="signals-container"></div>
        </div>

    </div>

    <!-- STATS -->
    <div class="live-stats">

        <div class="stat-card">
            <div class="stat-label">
                <span class="pulse-indicator"></span>
                Active Now
            </div>
            <div class="stat-value" id="activeUsers">1,200</div>
            <div class="stat-change">Live</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Total Signals</div>
            <div class="stat-value" id="totalSignals">0</div>
            <div class="stat-change">Real data</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Engagement Rate</div>
            <div class="stat-value">--</div>
            <div class="stat-change">Coming soon</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">AI Insights</div>
            <div class="stat-value">--</div>
            <div class="stat-change">Coming soon</div>
        </div>

    </div>

    <!-- MAIN GRID -->
    <div class="dashboard-grid">

        <!-- ACTIVITY -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    🔴 Live Activity Feed
                    <span class="panel-badge">Real-time</span>
                </h2>
            </div>

            <div class="activity-feed" id="activityFeed"></div>
        </div>

        <!-- TRENDING -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">🔥 Trending Now</h2>
            </div>

            <div class="trending-list" id="trendingList"></div>
        </div>

    </div>

</div>

<!-- ✅ FINAL FIX: ABSOLUTE JS PATH -->
<script src="/signals/signals-dashboard.js"></script>

</body>
</html>
