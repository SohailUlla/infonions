<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

<style>

body{

margin:0;

background:#050505;

color:white;

font-family:Inter,sans-serif;

}

.article{

max-width:850px;

margin:100px auto;

padding:20px;

}

.loading{

text-align:center;

margin-top:150px;

font-size:22px;

}

</style>

</head>

<body>

<div id="app" class="loading">

Loading article...

</div>

<script>


const params = new URLSearchParams(window.location.search);

const file = params.get("file");

loadArticle();

async function loadArticle(){

    if(!file){

        document.getElementById("app").innerHTML="Article not found.";

        return;

    }

    const url =
`https://raw.githubusercontent.com/SohailUlla/infonions/main/content/deepdive/${file}`;

    try{

        const res = await fetch(url);

        const md = await res.text();

        document.getElementById("app").innerHTML=`
            <div class="article">

                <pre style="white-space:pre-wrap;font-family:Inter;">
${md}
                </pre>

            </div>
        `;

    }

    catch(err){

        document.getElementById("app").innerHTML="Failed to load article.";

    }

}

</script>

</body>

</html>
