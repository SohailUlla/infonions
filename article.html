<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO: article.js will replace these dynamically -->
<title>Infonions</title>

<meta
    name="description"
    content="Infonions — Fearless Intelligence."
>

<link
    rel="canonical"
    id="canonical"
    href="https://infonions.com/"
>

<!-- Open Graph -->
<meta property="og:type" content="article">

<meta
    property="og:title"
    id="og-title"
    content="Infonions"
>

<meta
    property="og:description"
    id="og-description"
    content="Fearless Intelligence."
>

<meta
    property="og:url"
    id="og-url"
    content="https://infonions.com/"
>

<meta
    property="og:site_name"
    content="Infonions"
>

<!-- Twitter / X -->
<meta
    name="twitter:card"
    content="summary_large_image"
>

<meta
    name="twitter:title"
    id="twitter-title"
    content="Infonions"
>

<meta
    name="twitter:description"
    id="twitter-description"
    content="Fearless Intelligence."
>

<!-- Google font -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#050505;

    color:#F5F7FA;

    font-family:'Manrope',sans-serif;

}

/* Grid Background */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.03) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.03) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    z-index:-1;

}

/* Main Container */

.container{

    max-width:860px;

    margin:auto;

    padding:80px 24px;

}

/* Back */

.back{

    display:inline-block;

    margin-bottom:40px;

    color:#8A8F98;

    text-decoration:none;

    font-size:15px;

}

.back:hover{

    color:white;

}

/* Category */

.category{

    display:inline-block;

    padding:8px 16px;

    border-radius:999px;

    background:#18181d;

    color:#6EA8FE;

    font-size:13px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:24px;

}

/* Title */

.title{

    font-size:54px;

    line-height:1.05;

    font-weight:800;

    margin-bottom:20px;

}

/* Excerpt */

.excerpt{
    font-size:23px;
    line-height:1.7;
    color:#B6BCC8;
    margin-bottom:36px;
    max-width:850px;
}

/* Meta */

.meta{

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    font-size:15px;

    color:#8D95A4;

    margin-bottom:50px;

}

/* Hero */

.hero{

    width:100%;

    height:420px;

    border-radius:22px;

    background:#101115;

    margin-bottom:60px;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#555;

    font-size:18px;

    overflow:hidden;

}

.hero img{

    width:100%;

    height:100%;

    object-fit:cover;

}

/* Article */

.content{

    font-size:21px;

    line-height:2;

    color:#E5E7EB;

}

.content p{

    margin-bottom:34px;

}

.content h1{

    font-size:42px;

    line-height:1.2;

    margin-top:70px;

    margin-bottom:22px;

}

.content h2{

    font-size:36px;

    line-height:1.25;

    margin-top:70px;

    margin-bottom:22px;

}

.content h3{

    font-size:28px;

    line-height:1.3;

    margin-top:50px;

    margin-bottom:18px;

}

.content ul{

    padding-left:30px;

    margin:30px 0;

}

.content ol{

    padding-left:30px;

    margin:30px 0;

}

.content li{

    margin-bottom:14px;

}

.content strong{

    color:#FFFFFF;

    font-weight:700;

}

.content a{

    color:#6EA8FE;

}

.content blockquote{

    border-left:3px solid #6EA8FE;

    padding-left:20px;

    margin:35px 0;

    color:#B6BCC8;

}

/* Mobile */

@media(max-width:768px){

    .container{

        padding:30px 20px;

    }

    .title{

        font-size:38px;

    }

    .excerpt{

        font-size:20px;

    }

    .hero{

        height:220px;

    }

    .content{

        font-size:19px;

    }

    .content h1{

        font-size:32px;

    }

    .content h2{

        font-size:29px;

    }

    .content h3{

        font-size:24px;

    }

}

</style>

</head>


<body>

<main class="container">

    <a
        class="back"
        href="/"
    >
        ← Back to Home
    </a>


    <div
        class="category"
        id="category"
    >
        Loading...
    </div>


    <h1
        class="title"
        id="title"
    >
        Loading article...
    </h1>


    <p
        class="excerpt"
        id="excerpt"
    >
        Preparing article...
    </p>


    <div class="meta">

        <span id="author">
            Author
        </span>

        <span id="date">
            Date
        </span>

        <span id="reading">
            Reading time
        </span>

    </div>


    <div
        class="hero"
        id="hero"
    >
        Hero Image (coming soon)
    </div>


    <article
        class="content"
        id="content"
    >
        Loading article...
    </article>

</main>


<!-- Markdown parser -->

<script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
></script>


<!-- Article logic -->

<script src="/js/article.js"></script>

</body>

</html>
