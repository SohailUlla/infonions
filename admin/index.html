<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Infonions CMS</title>

<!-- Netlify Identity -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

</head>

<body>

<!-- Decap CMS -->
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

<script>
if (window.netlifyIdentity) {

  // Normal login redirect
  window.netlifyIdentity.on("init", user => {
    if (!user) {
      window.netlifyIdentity.on("login", () => {
        document.location.href = "/admin/";
      });
    }
  });

  // 🔥 FIX: Handle invite / reset tokens
  window.netlifyIdentity.on("init", () => {
    if (window.location.hash.includes("invite_token") || window.location.hash.includes("recovery_token")) {
      window.netlifyIdentity.open(); // opens password setup UI
    }
  });

  window.netlifyIdentity.on("open", () => {
    console.log("Identity widget opened");
  });
}
</script>

</body>
</html>
